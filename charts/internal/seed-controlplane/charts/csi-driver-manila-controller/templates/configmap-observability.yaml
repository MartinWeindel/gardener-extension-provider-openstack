apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-driver-manila-controller-observability-config
  namespace: {{ .Release.Namespace }}
  labels:
    extensions.gardener.cloud/configuration: monitoring
data:
  observedComponents: |
    observedPods:
    - podPrefix: csi-driver-manila-controller
      isExposedToUser: true
